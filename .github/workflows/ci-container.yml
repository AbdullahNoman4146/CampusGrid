name: Build, test, and publish container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/CampusGrid.Tests/CampusGrid.Tests.csproj

      - name: Test
        run: dotnet test tests/CampusGrid.Tests/CampusGrid.Tests.csproj --configuration Release --no-restore

      - name: Verify Docker build
        run: docker build --tag gridwise-ci:${{ github.sha }} .

      - name: Verify container health endpoint
        shell: bash
        run: |
          docker run --detach --name gridwise-health -p 8080:8080 gridwise-ci:${{ github.sha }}
          trap 'docker logs gridwise-health; docker rm --force gridwise-health' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health | grep --quiet '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish fallback image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
